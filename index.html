<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My App Store</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', 'Segoe UI', sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #202124;
            padding-bottom: 40px;
        }

        /* Search Header */
        .header {
            background: #ffffff;
            padding: 12px 16px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .search-box {
            width: 100%;
            padding: 12px 20px;
            border-radius: 24px;
            border: 1px solid #e0e0e0;
            background: #f1f3f4;
            font-size: 15px;
            outline: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-box input {
            border: none;
            background: transparent;
            width: 100%;
            outline: none;
            font-size: 15px;
            color: #3c4043;
        }

        /* Navigation Tabs */
        .tabs {
            display: flex;
            background: #ffffff;
            border-bottom: 1px solid #e0e0e0;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 14px 0;
            font-weight: 600;
            font-size: 14px;
            color: #5f6368;
            cursor: pointer;
            border-bottom: 3px solid transparent;
        }

        .tab.active {
            color: #01875f;
            border-bottom: 3px solid #01875f;
        }

        /* Container */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
        }

        /* Featured Banner */
        .featured-card {
            background: linear-gradient(135deg, #01875f 0%, #005c40 100%);
            color: white;
            padding: 24px 20px;
            border-radius: 16px;
            margin-bottom: 24px;
            box-shadow: 0 4px 12px rgba(1, 135, 95, 0.2);
        }

        .featured-card h2 {
            font-size: 22px;
            margin-bottom: 6px;
        }

        .featured-card p {
            font-size: 14px;
            opacity: 0.9;
        }

        /* Section Title */
        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: #202124;
            margin-bottom: 16px;
        }

        /* App Item List */
        .app-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .app-card {
            display: flex;
            align-items: center;
            background: #ffffff;
            padding: 12px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .app-icon {
            width: 64px;
            height: 64px;
            border-radius: 14px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            margin-right: 16px;
            flex-shrink: 0;
        }

        .app-info {
            flex: 1;
        }

        .app-title {
            font-size: 16px;
            font-weight: 600;
            color: #202124;
            margin-bottom: 2px;
        }

        .app-category {
            font-size: 13px;
            color: #5f6368;
            margin-bottom: 4px;
        }

        .app-meta {
            font-size: 12px;
            color: #01875f;
            font-weight: 500;
        }

        .install-btn {
            background: #e8f5e9;
            color: #01875f;
            padding: 8px 18px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }

        .install-btn:hover {
            background: #01875f;
            color: white;
        }
    </style>
</head>
<body>

    <!-- Search Bar -->
    <div class="header">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass" style="color: #5f6368;"></i>
            <input type="text" placeholder="Search apps & tools...">
        </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <div class="tab active">For you</div>
        <div class="tab">Top charts</div>
        <div class="tab">Categories</div>
    </div>

    <div class="container">
        <!-- Banner -->
        <div class="featured-card">
            <h2>Recommended Tools</h2>
            <p>Download powerful automation & daily utility apps.</p>
        </div>

        <div class="section-title">Suggested for you</div>

        <!-- App List -->
        <div class="app-list">

            <!-- App 1 -->
            <div class="app-card">
                <div class="app-icon" style="background: linear-gradient(135deg, #00f2fe, #4facfe);">
                    <i class="fa-brands fa-tiktok"></i>
                </div>
                <div class="app-info">
                    <div class="app-title">TikTok Automation</div>
                    <div class="app-category">Social • Tools</div>
                    <div class="app-meta">4.8 ★ | 15 MB</div>
                </div>
                <!-- Yahan apni TikTok APK file ka download link paste karein -->
                <a href="#" class="install-btn">INSTALL</a>
            </div>

            <!-- App 2 -->
            <div class="app-card">
                <div class="app-icon" style="background: linear-gradient(135deg, #ff0844, #ffb199);">
                    <i class="fa-brands fa-youtube"></i>
                </div>
                <div class="app-info">
                    <div class="app-title">YouTube Manager</div>
                    <div class="app-category">Video • Automation</div>
                    <div class="app-meta">4.9 ★ | 22 MB</div>
                </div>
                <!-- Yahan apni YouTube APK file ka download link paste karein -->
                <a href="#" class="install-btn">INSTALL</a>
            </div>

            <!-- App 3 -->
            <div class="app-card">
                <div class="app-icon" style="background: linear-gradient(135deg, #f12711, #f5af19);">
                    <i class="fa-solid fa-gear"></i>
                </div>
                <div class="app-info">
                    <div class="app-title">Utility Booster</div>
                    <div class="app-category">Tools • Helper</div>
                    <div class="app-meta">4.6 ★ | 8 MB</div>
                </div>
                <a href="#" class="install-btn">INSTALL</a>
            </div>

        </div>
    </div>

</body>
</html>
